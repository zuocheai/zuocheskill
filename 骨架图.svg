<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="972" viewBox="0 0 1000 972" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect width="1000" height="972" fill="#FFFFFF"/>

<text x="500" y="56" text-anchor="middle" fill="#0A0A0A" font-size="36" font-weight="700">你随口丢，它负责记牢、归好、到点出活</text>
<text x="500" y="96" text-anchor="middle" fill="#3F3F3F" font-size="21" font-weight="500">装完你就有了这八个文件夹 —— 丢进去就不用再管了</text>

<rect x="370" y="124" width="260" height="62" rx="31" fill="#4A90D9"/>
<text x="500" y="155" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="24" font-weight="700">你与 AI 的对话</text>
<text x="500" y="212" text-anchor="middle" fill="#3F3F3F" font-size="20" font-weight="500">不用整理语言 · 不用写提示词 · 一句话就行</text>
<path d="M500,226 L500,250" stroke="#8A8A8A" stroke-width="3" fill="none"/>

<rect x="365" y="252" width="270" height="62" rx="8" fill="#4A90D9"/>
<text x="500" y="283" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="24" font-weight="700">00-灵感库</text>
<text x="500" y="340" text-anchor="middle" fill="#1F5FA8" font-size="20" font-weight="600">AI 自动分门别类</text>
<path d="M500,354 L500,378" stroke="#8A8A8A" stroke-width="3" fill="none"/>

<rect x="50" y="380" width="280" height="62" rx="8" fill="#E8912D"/>
<text x="190" y="411" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="24" font-weight="700">01-项目</text>

<rect x="670" y="380" width="280" height="62" rx="8" fill="#E8912D"/>
<text x="810" y="411" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="24" font-weight="700">02-长期关注</text>

<rect x="360" y="380" width="280" height="62" rx="8" fill="#E8912D"/>
<text x="500" y="411" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="24" font-weight="700">03-参考资料</text>

<text x="190" y="472" text-anchor="middle" fill="#B45309" font-size="20" font-weight="600">有期限的活</text>
<text x="500" y="472" text-anchor="middle" fill="#B45309" font-size="20" font-weight="600">网上抄来的素材</text>
<text x="810" y="472" text-anchor="middle" fill="#B45309" font-size="20" font-weight="600">要长期攒的家底</text>

<rect x="360" y="502" width="280" height="62" rx="8" fill="#E8912D"/>
<text x="500" y="533" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="24" font-weight="700">04-归档</text>
<text x="500" y="596" text-anchor="middle" fill="#0F766E" font-size="20" font-weight="600">用完的收工区</text>

<rect x="50" y="630" width="280" height="62" rx="8" fill="#4CAF50"/>
<text x="190" y="661" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="24" font-weight="700">05-产出</text>

<rect x="670" y="630" width="280" height="62" rx="8" fill="#9575CD"/>
<text x="810" y="661" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="24" font-weight="700">06-沉淀</text>

<text x="190" y="726" text-anchor="middle" fill="#15803D" font-size="20" font-weight="600">提纲 → 粗稿 → 成品</text>
<text x="500" y="726" text-anchor="middle" fill="#7E22CE" font-size="20" font-weight="600">AI 提炼的概念与结论</text>
<text x="810" y="726" text-anchor="middle" fill="#7E22CE" font-size="20" font-weight="600">你只需要看这一个</text>

<text x="500" y="758" text-anchor="middle" fill="#6D28D9" font-size="20" font-weight="600">每条都能查到出处</text>

<rect x="360" y="790" width="280" height="62" rx="8" fill="#4CAF50"/>
<text x="500" y="821" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="24" font-weight="700">07-系统</text>
<text x="500" y="884" text-anchor="middle" fill="#B45309" font-size="20" font-weight="600">角色 · 面板 · 备份 · 待清</text>

<rect x="50" y="906" width="440" height="46" rx="8" fill="#E85D4A"/>
<text x="72" y="929" dominant-baseline="central" fill="#FFFFFF" font-size="20" font-weight="700">红线一 · 不会自动删你的东西</text>

<rect x="510" y="906" width="440" height="46" rx="8" fill="#0D9488"/>
<text x="532" y="929" dominant-baseline="central" fill="#FFFFFF" font-size="20" font-weight="700">红线二 · AI 自己推的结论标"待确认"</text>
</svg>
